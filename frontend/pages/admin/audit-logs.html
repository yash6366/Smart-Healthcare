<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compliance Audit Trail — Admin Portal — VakCare</title>
  <meta name="description" content="Immutable security and compliance audit logs for clinical access and system events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <!-- Filter Toolbar -->
        <div class="action-toolbar">
          <div class="filter-group" style="flex: 1;">
            <select id="eventTypeFilter" class="form-select" style="width: auto; min-width: 220px;" aria-label="Filter audit logs by event type">
              <option value="">All Event Types</option>
              <option value="AUTH_LOGIN">User Login</option>
              <option value="AUTH_LOGOUT">User Logout</option>
              <option value="AUTH_REGISTER">User Registration</option>
              <option value="AUTH_PASSWORD_CHANGE">Password Change</option>
              <option value="DOCTOR_VERIFIED">Doctor Verification</option>
              <option value="DOCTOR_AVAILABILITY">Doctor Availability Change</option>
              <option value="APPOINTMENT_CREATED">Appointment Created</option>
              <option value="APPOINTMENT_STATUS_CHANGE">Appointment Status Change</option>
              <option value="APPOINTMENT_CANCELLED">Appointment Cancelled</option>
              <option value="PRESCRIPTION_ISSUED">Prescription Issued</option>
              <option value="MEDICAL_RECORD_ACCESSED">Medical Record Accessed</option>
              <option value="MEDICAL_RECORD_CREATED">Medical Record Created</option>
              <option value="AI_QUERY">AI Query Executed</option>
              <option value="ADMIN_ACTION">Administrative Action</option>
            </select>

            <select id="resourceTypeFilter" class="form-select" style="width: auto;" aria-label="Filter audit logs by target resource">
              <option value="">All Resources</option>
              <option value="User">User Account</option>
              <option value="DoctorProfile">Doctor Profile</option>
              <option value="Appointment">Appointment</option>
              <option value="MedicalRecord">Medical Record</option>
              <option value="Prescription">Prescription</option>
            </select>

            <button id="resetAuditFiltersBtn" class="btn btn-outline btn-sm">Reset</button>
          </div>

          <div class="badge badge-info flex items-center gap-2">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
            <span>Immutable Regulatory Audit Trail</span>
          </div>
        </div>

        <!-- Audit Table Card -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-container" role="region" aria-label="Regulatory audit logs table" tabindex="0" style="border: none; box-shadow: none;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col">Log ID</th>
                    <th scope="col">Event Type</th>
                    <th scope="col">Actor</th>
                    <th scope="col">Action</th>
                    <th scope="col">Target Resource</th>
                    <th scope="col">IP Address</th>
                    <th scope="col">Timestamp</th>
                    <th scope="col">Status</th>
                    <th scope="col">Details</th>
                  </tr>
                </thead>
                <tbody id="auditTableBody">
                  <tr>
                    <td colspan="9" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Audit Event Detail Modal -->
  <div class="modal-backdrop" id="auditModal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalAuditTitle" style="max-width: 640px;">
      <div class="modal-header">
        <h3 class="card-title" id="modalAuditTitle">Audit Event Details</h3>
        <button class="btn-icon" id="closeAuditModal" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="grid grid-cols-2 gap-4" style="background: var(--color-bg-subtle); padding: var(--space-4); border-radius: var(--radius-md);">
          <div>
            <span style="font-size: 0.75rem; color: var(--color-text-subtle); text-transform: uppercase;">Event</span>
            <div style="font-weight: 600;" id="modalEventName">—</div>
          </div>
          <div>
            <span style="font-size: 0.75rem; color: var(--color-text-subtle); text-transform: uppercase;">Actor</span>
            <div style="font-weight: 600;" id="modalActor">—</div>
          </div>
          <div>
            <span style="font-size: 0.75rem; color: var(--color-text-subtle); text-transform: uppercase;">IP Address</span>
            <div style="font-weight: 600; font-family: var(--font-mono);" id="modalIp">—</div>
          </div>
          <div>
            <span style="font-size: 0.75rem; color: var(--color-text-subtle); text-transform: uppercase;">Timestamp</span>
            <div style="font-weight: 600;" id="modalTimestamp">—</div>
          </div>
        </div>

        <div>
          <span style="font-size: 0.75rem; color: var(--color-text-subtle); text-transform: uppercase;">Client User-Agent</span>
          <div id="modalUserAgent" style="font-size: 0.8rem; font-family: var(--font-mono); color: var(--color-text-muted); background: white; border: 1px solid var(--color-bg-muted); padding: 8px; border-radius: 6px; word-break: break-all; margin-top: 4px;"></div>
        </div>

        <div>
          <span style="font-size: 0.75rem; color: var(--color-text-subtle); text-transform: uppercase;">Captured Payload Parameters</span>
          <pre id="modalJsonDetails" style="font-size: 0.8rem; font-family: var(--font-mono); background: #0f172a; color: #38bdf8; padding: var(--space-4); border-radius: var(--radius-md); max-height: 220px; overflow-y: auto; margin-top: 4px;"></pre>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" id="closeAuditFooterBtn">Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { Auth } from '../../js/auth.js';
    import { api } from '../../js/api-client.js';
    import { initAppLayout } from '../../js/components.js';
    import { formatDate, formatTime, escapeHtml, renderEmptyState } from '../../js/ui.js';

    const user = await Auth.guardRoute(['ADMIN']);
    if (!user) throw new Error('Unauthorized');

    await initAppLayout({
      title: 'Compliance & Security Audit Trail',
      subtitle: 'Immutable record of clinical record access, authentication events, and administrative decisions',
    });

    const eventFilter = document.getElementById('eventTypeFilter');
    const resourceFilter = document.getElementById('resourceTypeFilter');
    const resetBtn = document.getElementById('resetAuditFiltersBtn');

    eventFilter.addEventListener('change', loadAuditLogs);
    resourceFilter.addEventListener('change', loadAuditLogs);
    resetBtn.addEventListener('click', () => {
      eventFilter.value = '';
      resourceFilter.value = '';
      loadAuditLogs();
    });

    loadAuditLogs();

    async function loadAuditLogs() {
      const tbody = document.getElementById('auditTableBody');
      tbody.innerHTML = `<tr><td colspan="9" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td></tr>`;

      const params = {};
      if (eventFilter.value) params.event_type = eventFilter.value;
      if (resourceFilter.value) params.resource_type = resourceFilter.value;

      try {
        const res = await api.get('/audit/logs/', params);
        const logs = res.results || [];

        if (logs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="9">
                ${renderEmptyState({
                  title: 'No Audit Records',
                  message: 'No security audit entries match your filter parameters.',
                })}
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td><span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-subtle);">#LOG-${l.id}</span></td>
            <td><span class="badge badge-neutral">${escapeHtml(l.event_type)}</span></td>
            <td><strong>${escapeHtml(l.actor_username || 'Anonymous')}</strong></td>
            <td>${escapeHtml(l.action)}</td>
            <td>${escapeHtml(l.resource_type ? `${l.resource_type} #${l.resource_id}` : '—')}</td>
            <td><span style="font-family: var(--font-mono); font-size: 0.8rem;">${escapeHtml(l.ip_address || '—')}</span></td>
            <td>${formatDate(l.created_at)} ${formatTime(l.created_at.split('T')[1] || '')}</td>
            <td>
              <span class="badge ${l.is_success ? 'badge-confirmed' : 'badge-danger'}">
                ${l.is_success ? 'Success' : 'Failed'}
              </span>
            </td>
            <td>
              <button class="btn btn-outline btn-sm view-log-btn" data-log='${JSON.stringify(l)}'>
                Inspect
              </button>
            </td>
          </tr>
        `).join('');

        tbody.querySelectorAll('.view-log-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const l = JSON.parse(btn.dataset.log);
            openAuditModal(l);
          });
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-danger text-center">Failed to load audit logs: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    // Modal
    const modal = document.getElementById('auditModal');

    function openAuditModal(l) {
      document.getElementById('modalAuditTitle').textContent = `Audit Log #LOG-${l.id}`;
      document.getElementById('modalEventName').textContent = l.event_type;
      document.getElementById('modalActor').textContent = l.actor_username || 'Anonymous';
      document.getElementById('modalIp').textContent = l.ip_address || 'Unknown';
      document.getElementById('modalTimestamp').textContent = `${formatDate(l.created_at)} at ${formatTime(l.created_at.split('T')[1] || '')}`;
      document.getElementById('modalUserAgent').textContent = l.user_agent || 'Standard HTTP Client';
      document.getElementById('modalJsonDetails').textContent = JSON.stringify(l.details || {}, null, 2);

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    document.getElementById('closeAuditModal').onclick = closeModal;
    document.getElementById('closeAuditFooterBtn').onclick = closeModal;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
