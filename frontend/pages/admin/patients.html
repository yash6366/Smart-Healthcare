<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registry — Admin Portal — VakCare</title>
  <meta name="description" content="Manage registered patients and review clinical demographics.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <!-- Toolbar -->
        <div class="card" style="margin-bottom: var(--space-8); padding: var(--space-5);">
          <div class="action-toolbar" style="margin-bottom: 0;">
            <div class="search-box" style="flex: 1; min-width: 260px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
              <input type="text" id="patientSearchInput" class="form-control" placeholder="Search patient by name or email address..." aria-label="Search patient by name or email address">
            </div>
            <button id="resetSearchBtn" class="btn btn-outline btn-sm">Clear Filter</button>
          </div>
        </div>

        <!-- Table Card -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-container" role="region" aria-label="Patients registry table" tabindex="0" style="border: none; box-shadow: none;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col">Patient ID</th>
                    <th scope="col">Patient Name</th>
                    <th scope="col">Email Address</th>
                    <th scope="col">Phone</th>
                    <th scope="col">Blood Group</th>
                    <th scope="col">Gender / DOB</th>
                    <th scope="col">Location</th>
                    <th scope="col">Registered At</th>
                  </tr>
                </thead>
                <tbody id="adminPatientsTbody">
                  <tr>
                    <td colspan="8" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { Auth } from '../../js/auth.js';
    import { api } from '../../js/api-client.js';
    import { initAppLayout } from '../../js/components.js';
    import { formatDate, escapeHtml, renderEmptyState } from '../../js/ui.js';

    const user = await Auth.guardRoute(['ADMIN']);
    if (!user) throw new Error('Unauthorized');

    await initAppLayout({
      title: 'Patient Registry',
      subtitle: 'Global patient demographics and account records',
    });

    const searchInput = document.getElementById('patientSearchInput');
    searchInput.addEventListener('input', debounce(loadPatients, 350));
    document.getElementById('resetSearchBtn').addEventListener('click', () => {
      searchInput.value = '';
      loadPatients();
    });

    loadPatients();

    async function loadPatients() {
      const tbody = document.getElementById('adminPatientsTbody');
      tbody.innerHTML = `<tr><td colspan="8" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td></tr>`;

      const params = {};
      const search = searchInput.value.trim();
      if (search) params.search = search;

      try {
        const res = await api.get('/patients/', params);
        const patients = res.results || [];

        if (patients.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8">
                ${renderEmptyState({
                  title: 'No Patients Found',
                  message: search ? `No patients matching "${search}".` : 'No patients registered in the system.',
                })}
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = patients.map(p => {
          const u = p.user || {};
          const fullName = u.first_name ? `${u.first_name} ${u.last_name}` : u.username;
          return `
            <tr>
              <td><span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-subtle);">#PAT-${p.id}</span></td>
              <td>
                <div class="flex items-center gap-3">
                  <div class="avatar" style="width: 32px; height: 32px; font-size: 0.75rem;">
                    ${escapeHtml((u.first_name?.[0] || u.username?.[0] || 'P').toUpperCase())}
                  </div>
                  <strong>${escapeHtml(fullName)}</strong>
                </div>
              </td>
              <td>${escapeHtml(u.email || '—')}</td>
              <td>${escapeHtml(u.phone_number || '—')}</td>
              <td><span class="badge ${p.blood_group !== 'UNKNOWN' ? 'badge-confirmed' : 'badge-neutral'}">${escapeHtml(p.blood_group || 'UNKNOWN')}</span></td>
              <td>
                <div style="font-size: 0.85rem;">${escapeHtml(p.gender || '—')}</div>
                <div style="font-size: 0.75rem; color: var(--color-text-subtle);">${formatDate(p.date_of_birth)}</div>
              </td>
              <td>${escapeHtml(p.city ? `${p.city}, ${p.state}` : '—')}</td>
              <td>${formatDate(p.created_at)}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center">Failed to load patients: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
  </script>
</body>
</html>
