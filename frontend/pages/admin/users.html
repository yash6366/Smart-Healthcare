<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Accounts Directory — Admin Portal — VakCare</title>
  <meta name="description" content="Manage user platform roles, authentication accounts, and verification.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <!-- Toolbar Filters -->
        <div class="action-toolbar">
          <div class="filter-group" style="flex: 1;">
            <div class="search-box" style="flex: 1; min-width: 240px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
              <input type="text" id="userSearchInput" class="form-control" placeholder="Search accounts by name or email address..." aria-label="Search accounts by name or email address">
            </div>

            <select id="roleFilter" class="form-select" style="width: auto;" aria-label="Filter accounts by platform role">
              <option value="">All Platform Roles</option>
              <option value="PATIENT">Patients</option>
              <option value="DOCTOR">Doctors</option>
              <option value="ADMIN">Administrators</option>
            </select>
          </div>
        </div>

        <!-- Users Table Card -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-container" role="region" aria-label="Platform user accounts list" tabindex="0" style="border: none; box-shadow: none;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th scope="col">User ID</th>
                    <th scope="col">Account Holder</th>
                    <th scope="col">Email Address</th>
                    <th scope="col">Phone</th>
                    <th scope="col">Platform Role</th>
                    <th scope="col">Status</th>
                    <th scope="col">Joined Date</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <tr>
                    <td colspan="7" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { Auth } from '../../js/auth.js';
    import { api } from '../../js/api-client.js';
    import { initAppLayout } from '../../js/components.js';
    import { formatDate, escapeHtml, renderEmptyState } from '../../js/ui.js';

    const currentUser = await Auth.guardRoute(['ADMIN']);
    if (!currentUser) throw new Error('Unauthorized');

    await initAppLayout({
      title: 'Platform Users Directory',
      subtitle: 'Overview of registered patient accounts, clinical staff, and platform administrators',
    });

    const searchInput = document.getElementById('userSearchInput');
    const roleFilter = document.getElementById('roleFilter');

    searchInput.addEventListener('input', debounce(loadUsers, 350));
    roleFilter.addEventListener('change', loadUsers);

    loadUsers();

    async function loadUsers() {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td></tr>`;

      const search = searchInput.value.trim().toLowerCase();
      const role = roleFilter.value;

      try {
        // Collect users across patients and doctors
        const [patientsRes, doctorsRes] = await Promise.all([
          api.get('/patients/', { page_size: 100 }),
          api.get('/doctors/', { page_size: 100 }),
        ]);

        const usersMap = new Map();

        // Always include current admin
        usersMap.set(currentUser.id, currentUser);

        (patientsRes.results || []).forEach(p => {
          if (p.user) usersMap.set(p.user.id, p.user);
        });

        (doctorsRes.results || []).forEach(d => {
          if (d.user) usersMap.set(d.user.id, d.user);
        });

        let allUsers = Array.from(usersMap.values());

        // Apply filters
        if (role) {
          allUsers = allUsers.filter(u => u.role === role);
        }
        if (search) {
          allUsers = allUsers.filter(u =>
            (u.username && u.username.toLowerCase().includes(search)) ||
            (u.email && u.email.toLowerCase().includes(search)) ||
            (u.first_name && u.first_name.toLowerCase().includes(search)) ||
            (u.last_name && u.last_name.toLowerCase().includes(search))
          );
        }

        if (allUsers.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7">
                ${renderEmptyState({
                  title: 'No Accounts Found',
                  message: 'No users matched the search criteria.',
                })}
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = allUsers.map(u => {
          let roleBadge = 'badge-neutral';
          if (u.role === 'ADMIN') roleBadge = 'badge-danger';
          if (u.role === 'DOCTOR') roleBadge = 'badge-info';
          if (u.role === 'PATIENT') roleBadge = 'badge-confirmed';

          const fullName = u.first_name ? `${u.first_name} ${u.last_name}` : u.username;

          return `
            <tr>
              <td><span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-subtle);">#USR-${u.id}</span></td>
              <td>
                <div class="flex items-center gap-3">
                  <div class="avatar" style="width: 32px; height: 32px; font-size: 0.75rem;">
                    ${escapeHtml((u.first_name?.[0] || u.username?.[0] || 'U').toUpperCase())}
                  </div>
                  <div>
                    <strong>${escapeHtml(fullName)}</strong>
                    <div style="font-size: 0.75rem; color: var(--color-text-subtle);">@${escapeHtml(u.username)}</div>
                  </div>
                </div>
              </td>
              <td>${escapeHtml(u.email)}</td>
              <td>${escapeHtml(u.phone_number || '—')}</td>
              <td><span class="badge ${roleBadge}">${escapeHtml(u.role)}</span></td>
              <td>
                <span class="badge ${u.is_verified ? 'badge-confirmed' : 'badge-pending'}">
                  ${u.is_verified ? 'Verified' : 'Unverified'}
                </span>
              </td>
              <td>${formatDate(u.created_at)}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-danger text-center">Failed to load user accounts: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
  </script>
</body>
</html>
