<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Specialists Directory — VakCare</title>
  <meta name="description" content="Search verified medical practitioners and book consultations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <!-- Toolbar Filters -->
        <div class="card" style="margin-bottom: var(--space-8); padding: var(--space-5);">
          <div class="action-toolbar" style="margin-bottom: 0;">
            <div class="search-box" style="flex: 1; min-width: 240px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
              <input type="text" id="searchInput" class="form-control" placeholder="Search doctor by name or qualifications (e.g. MBBS, Cardiology)..." aria-label="Search doctor by name or qualifications">
            </div>

            <div class="filter-group">
              <select id="specializationSelect" class="form-select" style="width: auto; min-width: 180px;" aria-label="Filter by medical specialization">
                <option value="">All Specializations</option>
              </select>

              <select id="orderingSelect" class="form-select" style="width: auto;" aria-label="Sort doctors list">
                <option value="">Sort By</option>
                <option value="consultation_fee">Fee: Low to High</option>
                <option value="-consultation_fee">Fee: High to Low</option>
                <option value="-years_of_experience">Experience: Highest</option>
              </select>

              <button id="resetFiltersBtn" class="btn btn-outline btn-sm">Reset</button>
            </div>
          </div>
        </div>

        <!-- Doctors Directory Grid -->
        <div id="doctorsGrid" class="grid grid-cols-3 gap-6" role="region" aria-label="Specialists directory">
          <div class="col-span-3 text-center" style="grid-column: 1 / -1; padding: 3rem;">
            <div class="spinner spinner-lg"></div>
            <p style="margin-top: 1rem; color: var(--color-text-muted);">Fetching certified medical specialists...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Booking Modal Dialog -->
  <div class="modal-backdrop" id="bookingModal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="bookingDoctorTitle">
      <div class="modal-header">
        <div>
          <h3 class="card-title" id="bookingDoctorTitle">Book Consultation</h3>
          <span style="font-size: 0.8rem; color: var(--color-text-muted);" id="bookingDoctorSubtitle">Specialist</span>
        </div>
        <button class="btn-icon" id="closeBookingModal" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        </button>
      </div>

      <form id="bookingForm" novalidate>
        <div class="modal-body">
          <div id="bookingModalAlert" class="auth-alert auth-alert-error hidden" role="alert" aria-live="assertive" style="margin-bottom: var(--space-4);"></div>

          <input type="hidden" id="bookDoctorId" name="doctor_id">

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label class="form-label" for="bookDate">
                Appointment Date <span class="required-indicator" aria-hidden="true">*</span>
              </label>
              <input type="date" id="bookDate" name="appointment_date" class="form-control" required aria-required="true">
            </div>

            <div class="form-group">
              <label class="form-label" for="bookTime">
                Preferred Time <span class="required-indicator" aria-hidden="true">*</span>
              </label>
              <input type="time" id="bookTime" name="start_time" class="form-control" required aria-required="true">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="bookDuration">Duration</label>
            <select id="bookDuration" name="duration_minutes" class="form-select">
              <option value="15">15 minutes (Quick follow-up)</option>
              <option value="30" selected>30 minutes (Standard consultation)</option>
              <option value="45">45 minutes (Detailed evaluation)</option>
              <option value="60">60 minutes (Comprehensive assessment)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="bookReason">
              Symptoms / Reason for Consultation <span class="required-indicator" aria-hidden="true">*</span>
            </label>
            <textarea
              id="bookReason"
              name="reason"
              class="form-textarea"
              placeholder="Please describe your primary symptoms or reason for visit (minimum 5 characters)..."
              required
              aria-required="true"
            ></textarea>
            <span class="form-hint">Brief clinical context helps the doctor prepare for your consultation.</span>
          </div>

          <div style="background-color: var(--color-bg-subtle); border-radius: var(--radius-md); padding: var(--space-4); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; color: var(--color-text-muted);">Consultation Fee:</span>
            <strong style="font-size: 1.1rem; color: var(--color-primary);" id="bookingModalFee">₹0.00</strong>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelBookingBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="confirmBookingBtn">
            <span id="bookBtnText">Confirm & Schedule</span>
            <span id="bookBtnSpinner" class="spinner hidden" style="border-top-color: white; border-color: rgba(255,255,255,0.3);"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { Auth } from '../../js/auth.js';
    import { api } from '../../js/api-client.js';
    import { CONFIG } from '../../js/config.js';
    import { initAppLayout } from '../../js/components.js';
    import { Validation } from '../../js/validation.js';
    import { formatCurrency, formatTime, escapeHtml, showToast, renderEmptyState } from '../../js/ui.js';

    // Guard route
    const user = await Auth.guardRoute(['PATIENT', 'ADMIN']);
    if (!user) throw new Error('Unauthorized');

    await initAppLayout({
      title: 'Medical Specialists',
      subtitle: 'Browse certified physicians and book consultation slots',
    });

    // Populate specializations dropdown
    const specSelect = document.getElementById('specializationSelect');
    CONFIG.SPECIALIZATIONS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      specSelect.appendChild(opt);
    });

    // Check if query parameter has pre-selected specialization
    const urlParams = new URLSearchParams(window.location.search);
    const preSpec = urlParams.get('specialization');
    if (preSpec) specSelect.value = preSpec;

    // Set minimum date to today
    const dateInput = document.getElementById('bookDate');
    const todayStr = new Date().toISOString().split('T')[0];
    dateInput.min = todayStr;

    // Load Doctors
    loadDoctors();

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', debounce(loadDoctors, 350));
    document.getElementById('specializationSelect').addEventListener('change', loadDoctors);
    document.getElementById('orderingSelect').addEventListener('change', loadDoctors);
    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('specializationSelect').value = '';
      document.getElementById('orderingSelect').value = '';
      loadDoctors();
    });

    async function loadDoctors() {
      const grid = document.getElementById('doctorsGrid');
      grid.innerHTML = `
        <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
          <div class="spinner spinner-lg"></div>
        </div>
      `;

      const params = {};
      const search = document.getElementById('searchInput').value.trim();
      const spec = document.getElementById('specializationSelect').value;
      const ordering = document.getElementById('orderingSelect').value;

      if (search) params.search = search;
      if (spec) params.specialization = spec;
      if (ordering) params.ordering = ordering;

      try {
        const res = await api.get('/doctors/', params);
        const doctors = res.results || [];

        if (doctors.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1 / -1;">
              ${renderEmptyState({
                title: 'No Doctors Found',
                message: 'No doctors matched your criteria. Try adjusting your search keyword or specialization filter.',
              })}
            </div>
          `;
          return;
        }

        grid.innerHTML = doctors.map(doc => `
          <div class="card doctor-card" style="display: flex; flex-direction: column;">
            <div class="card-header" style="align-items: flex-start;">
              <div class="flex items-center gap-3">
                <div class="avatar" style="width: 44px; height: 44px; font-size: 1rem;">
                  ${escapeHtml((doc.display_name?.[0] || 'D').toUpperCase())}
                </div>
                <div>
                  <h3 style="font-size: 1rem; font-weight: 700;">Dr. ${escapeHtml(doc.display_name)}</h3>
                  <div style="font-size: 0.75rem; color: var(--color-primary); font-weight: 600;">
                    ${escapeHtml(doc.specialization_display || doc.specialization)}
                  </div>
                </div>
              </div>
              <span class="badge badge-confirmed">Verified</span>
            </div>

            <div class="card-body" style="flex: 1; display: flex; flex-direction: column; gap: var(--space-3);">
              <div style="font-size: 0.85rem; color: var(--color-text-muted);">
                <strong>Qualifications:</strong> ${escapeHtml(doc.qualifications || 'Certified Specialist')}
              </div>
              <div style="font-size: 0.85rem; color: var(--color-text-muted);">
                <strong>Experience:</strong> ${doc.years_of_experience} years
              </div>
              <div style="font-size: 0.85rem; color: var(--color-text-muted);">
                <strong>Hours:</strong> ${formatTime(doc.working_hours_start)} – ${formatTime(doc.working_hours_end)}
              </div>
              ${doc.biography ? `
                <div style="font-size: 0.8rem; color: var(--color-text-subtle); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                  ${escapeHtml(doc.biography)}
                </div>
              ` : ''}

              <div style="margin-top: auto; padding-top: var(--space-4); border-top: 1px solid var(--color-bg-muted); display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-size: 0.7rem; color: var(--color-text-subtle); text-transform: uppercase;">Fee</div>
                  <strong style="color: var(--color-primary); font-size: 1.15rem;">${formatCurrency(doc.consultation_fee)}</strong>
                </div>
                <button
                  class="btn btn-primary btn-sm book-btn"
                  data-id="${doc.id}"
                  data-name="${escapeHtml(doc.display_name)}"
                  data-spec="${escapeHtml(doc.specialization_display || doc.specialization)}"
                  data-fee="${doc.consultation_fee}"
                >
                  Book Slot
                </button>
              </div>
            </div>
          </div>
        `).join('');

        // Attach click handlers to Book Slot buttons
        grid.querySelectorAll('.book-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            openBookingModal({
              id: btn.dataset.id,
              name: btn.dataset.name,
              spec: btn.dataset.spec,
              fee: btn.dataset.fee,
            });
          });
        });
      } catch (err) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1;" class="alert alert-danger">
            Failed to load doctors directory: ${escapeHtml(err.message)}
          </div>
        `;
      }
    }

    // Modal Handling
    const modal = document.getElementById('bookingModal');
    const modalAlert = document.getElementById('bookingModalAlert');
    const bookingForm = document.getElementById('bookingForm');

    function openBookingModal({ id, name, spec, fee }) {
      document.getElementById('bookDoctorId').value = id;
      document.getElementById('bookingDoctorTitle').textContent = `Book Dr. ${name}`;
      document.getElementById('bookingDoctorSubtitle').textContent = spec;
      document.getElementById('bookingModalFee').textContent = formatCurrency(fee);

      // Set min date to today and default to tomorrow
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      const bookDateInput = document.getElementById('bookDate');
      bookDateInput.min = todayStr;

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      bookDateInput.value = tomorrow.toISOString().split('T')[0];
      document.getElementById('bookTime').value = '10:00';
      document.getElementById('bookReason').value = '';

      modalAlert.classList.add('hidden');
      Validation.clearFieldErrors(bookingForm);
      modal.classList.add('active');
    }

    function closeBookingModal() {
      modal.classList.remove('active');
    }

    document.getElementById('closeBookingModal').onclick = closeBookingModal;
    document.getElementById('cancelBookingBtn').onclick = closeBookingModal;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeBookingModal();
      }
    });

    bookingForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      modalAlert.classList.add('hidden');
      Validation.clearFieldErrors(bookingForm);

      const doctorId = parseInt(document.getElementById('bookDoctorId').value, 10);
      const apptDate = document.getElementById('bookDate').value;
      const startTime = document.getElementById('bookTime').value;
      const duration = parseInt(document.getElementById('bookDuration').value, 10);
      const reason = document.getElementById('bookReason').value.trim();

      let hasError = false;

      if (!apptDate) {
        Validation.setFieldError(document.getElementById('bookDate'), 'Please choose an appointment date.');
        hasError = true;
      } else if (!Validation.isFutureDate(apptDate)) {
        Validation.setFieldError(document.getElementById('bookDate'), 'Appointment date cannot be in the past.');
        hasError = true;
      }

      if (!startTime) {
        Validation.setFieldError(document.getElementById('bookTime'), 'Please specify a consultation start time.');
        hasError = true;
      }

      if (!reason || reason.length < 5) {
        Validation.setFieldError(document.getElementById('bookReason'), 'Please state your reason for consultation (min 5 characters).');
        hasError = true;
      }

      if (hasError) return;

      const submitBtn = document.getElementById('confirmBookingBtn');
      const btnText = document.getElementById('bookBtnText');
      const btnSpinner = document.getElementById('bookBtnSpinner');

      submitBtn.disabled = true;
      btnText.textContent = 'Scheduling...';
      btnSpinner.classList.remove('hidden');

      try {
        const payload = {
          doctor_id: doctorId,
          appointment_date: apptDate,
          start_time: startTime.length === 5 ? `${startTime}:00` : startTime,
          duration_minutes: duration,
          reason: reason,
        };

        const res = await api.post('/appointments/', payload);

        showToast('Appointment requested successfully! The doctor will confirm your slot.', 'success');
        closeBookingModal();

        // Redirect to appointments view after brief confirmation
        setTimeout(() => {
          window.location.href = 'appointments.html';
        }, 1000);
      } catch (err) {
        submitBtn.disabled = false;
        btnText.textContent = 'Confirm & Schedule';
        btnSpinner.classList.add('hidden');

        modalAlert.textContent = err.message || 'Unable to book appointment slot. It may already be reserved.';
        modalAlert.classList.remove('hidden');

        if (err.details) {
          Validation.applyServerErrors(bookingForm, err.details);
        }
      }
    });

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
  </script>
</body>
</html>
