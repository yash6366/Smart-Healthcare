<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments — VakCare</title>
  <meta name="description" content="View and manage scheduled medical consultations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <main class="app-main">
      <div class="app-content">
        <!-- Toolbar & Filter -->
        <div class="action-toolbar">
          <div class="filter-group">
            <select id="statusFilter" class="form-select" style="width: auto; min-width: 180px;">
              <option value="">All Statuses</option>
              <option value="PENDING">Pending Confirmation</option>
              <option value="CONFIRMED">Confirmed</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
              <option value="REJECTED">Rejected</option>
            </select>
          </div>

          <a href="doctors.html" class="btn btn-primary btn-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
            Book New Consultation
          </a>
        </div>

        <!-- Appointments Table Card -->
        <div class="card">
          <div class="card-body" style="padding: 0;">
            <div class="table-container" style="border: none; box-shadow: none;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Appointment ID</th>
                    <th>Doctor</th>
                    <th>Specialization</th>
                    <th>Date & Time</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="appointmentsTableBody">
                  <tr>
                    <td colspan="7" class="text-center" style="padding: 2.5rem;">
                      <div class="spinner"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Cancellation Modal Dialog -->
  <div class="modal-backdrop" id="cancelModal">
    <div class="modal-dialog" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="card-title text-danger">Cancel Consultation</h3>
        <button class="btn-icon" id="closeCancelModal" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <p style="font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: var(--space-4);">
          Are you sure you want to cancel this appointment? Your scheduled doctor slot will be released.
        </p>

        <div class="form-group">
          <label class="form-label" for="cancelReasonInput">Cancellation Reason (Optional)</label>
          <textarea
            id="cancelReasonInput"
            class="form-textarea"
            placeholder="e.g. Schedule conflict or resolved symptoms..."
          ></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelModalDismissBtn">Keep Appointment</button>
        <button type="button" class="btn btn-danger" id="confirmCancelApptBtn">
          <span id="cancelBtnText">Cancel Consultation</span>
          <span id="cancelBtnSpinner" class="spinner hidden" style="border-top-color: white;"></span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { Auth } from '../../js/auth.js';
    import { api } from '../../js/api-client.js';
    import { initAppLayout } from '../../js/components.js';
    import { formatDate, formatTime, renderStatusBadge, renderEmptyState, escapeHtml, showToast } from '../../js/ui.js';

    const user = await Auth.guardRoute(['PATIENT', 'ADMIN']);
    if (!user) throw new Error('Unauthorized');

    await initAppLayout({
      title: 'My Consultations',
      subtitle: 'Schedule and manage upcoming and past medical visits',
    });

    const statusFilter = document.getElementById('statusFilter');
    statusFilter.addEventListener('change', loadAppointments);

    loadAppointments();

    async function loadAppointments() {
      const tbody = document.getElementById('appointmentsTableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding: 2.5rem;"><div class="spinner"></div></td></tr>`;

      const params = {};
      const status = statusFilter.value;
      if (status) params.status = status;

      try {
        const res = await api.get('/appointments/', params);
        const appts = res.results || [];

        if (appts.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7">
                ${renderEmptyState({
                  title: 'No Appointments Found',
                  message: status ? `No appointments with status "${status}".` : 'You have not scheduled any consultations yet.',
                  actionText: 'Book a Consultation',
                  actionId: 'emptyBookBtn',
                })}
              </td>
            </tr>
          `;
          const emptyBookBtn = document.getElementById('emptyBookBtn');
          if (emptyBookBtn) emptyBookBtn.onclick = () => window.location.href = 'doctors.html';
          return;
        }

        tbody.innerHTML = appts.map(a => {
          const isCancellable = a.status === 'PENDING' || a.status === 'CONFIRMED';
          return `
            <tr>
              <td><span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-text-subtle);">#${a.id}</span></td>
              <td>
                <div class="flex items-center gap-3">
                  <div class="avatar" style="width: 32px; height: 32px; font-size: 0.75rem;">
                    ${escapeHtml((a.doctor?.display_name?.[0] || 'D').toUpperCase())}
                  </div>
                  <div>
                    <strong>Dr. ${escapeHtml(a.doctor?.display_name || 'Specialist')}</strong>
                    <div style="font-size: 0.75rem; color: var(--color-text-subtle);">${escapeHtml(a.doctor?.qualifications || '')}</div>
                  </div>
                </div>
              </td>
              <td>${escapeHtml(a.doctor?.specialization_display || a.doctor?.specialization || 'General')}</td>
              <td>
                <div style="font-weight: 500;">${formatDate(a.appointment_date)}</div>
                <div style="font-size: 0.75rem; color: var(--color-text-subtle);">${formatTime(a.start_time)} (${a.duration_minutes} min)</div>
              </td>
              <td style="max-width: 240px;">
                <div style="font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(a.reason)}">
                  ${escapeHtml(a.reason)}
                </div>
                ${a.cancellation_reason ? `<div style="font-size: 0.75rem; color: var(--color-danger); margin-top: 2px;">Reason: ${escapeHtml(a.cancellation_reason)}</div>` : ''}
              </td>
              <td>${renderStatusBadge(a.status)}</td>
              <td>
                ${isCancellable ? `
                  <button class="btn btn-outline btn-sm text-danger cancel-appt-btn" data-id="${a.id}">
                    Cancel
                  </button>
                ` : `
                  <span style="font-size: 0.75rem; color: var(--color-text-subtle);">—</span>
                `}
              </td>
            </tr>
          `;
        }).join('');

        // Attach cancel triggers
        tbody.querySelectorAll('.cancel-appt-btn').forEach(btn => {
          btn.addEventListener('click', () => openCancelModal(btn.dataset.id));
        });
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-danger text-center" style="padding: 2rem;">
              Failed to load appointments: ${escapeHtml(err.message)}
            </td>
          </tr>
        `;
      }
    }

    // Cancellation Modal Logic
    const cancelModal = document.getElementById('cancelModal');
    let activeCancelId = null;

    function openCancelModal(id) {
      activeCancelId = id;
      document.getElementById('cancelReasonInput').value = '';
      cancelModal.classList.add('active');
    }

    function closeCancelModal() {
      cancelModal.classList.remove('active');
      activeCancelId = null;
    }

    document.getElementById('closeCancelModal').onclick = closeCancelModal;
    document.getElementById('cancelModalDismissBtn').onclick = closeCancelModal;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && cancelModal.classList.contains('active')) {
        closeCancelModal();
      }
    });

    document.getElementById('confirmCancelApptBtn').addEventListener('click', async () => {
      if (!activeCancelId) return;

      const reason = document.getElementById('cancelReasonInput').value.trim();
      const confirmBtn = document.getElementById('confirmCancelApptBtn');
      const btnText = document.getElementById('cancelBtnText');
      const btnSpinner = document.getElementById('cancelBtnSpinner');

      confirmBtn.disabled = true;
      btnText.textContent = 'Cancelling...';
      btnSpinner.classList.remove('hidden');

      try {
        await api.post(`/appointments/${activeCancelId}/cancel/`, {
          cancellation_reason: reason,
        });
        showToast('Appointment cancelled successfully.', 'info');
        closeCancelModal();
        loadAppointments();
      } catch (err) {
        showToast(err.message || 'Failed to cancel appointment.', 'error');
      } finally {
        confirmBtn.disabled = false;
        btnText.textContent = 'Cancel Consultation';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
